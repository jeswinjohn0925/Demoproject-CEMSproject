{% extends 'base.html' %}

{% block title %}Admin Login - CEMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white text-center">
                <h4><i class="fas fa-shield-alt"></i> Administrator Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Login as Admin</button>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted small">Administrator accounts are created via terminal</p>
                    <p><a href="{% url 'home' %}">Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
