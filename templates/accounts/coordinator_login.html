{% extends 'base.html' %}

{% block title %}Coordinator Login - CEMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-warning text-white text-center">
                <h4><i class="fas fa-crown"></i> Coordinator Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Login as Coordinator</button>
                </form>
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{% url 'coordinator_register' %}">Register here</a></p>
                    <p><a href="{% url 'home' %}">Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
